<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" fill="#FAF6F0"/>
  
  <!-- Logo BJ stylisé -->
  <g transform="translate(50, 50)">
    <!-- Lettre B -->
    <path d="M -20 -25 L -20 25 M -20 -25 C -5 -25, 0 -20, 0 -12.5 C 0 -5, -5 0, -10 0 M -10 0 C 0 0, 5 5, 5 12.5 C 5 20, 0 25, -10 25 L -20 25" 
          stroke="#1F2421" 
          stroke-width="6" 
          fill="none" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Lettre J -->
    <path d="M 10 -25 L 10 15 C 10 22, 7 25, 0 25" 
          stroke="#1F2421" 
          stroke-width="6" 
          fill="none" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Barre horizontale au-dessus du J -->
    <path d="M 3 -25 L 17 -25" 
          stroke="#1F2421" 
          stroke-width="6" 
          stroke-linecap="round"/>
  </g>
</svg>
